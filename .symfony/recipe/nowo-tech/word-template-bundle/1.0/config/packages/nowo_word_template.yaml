nowo_word_template:
    timeout: 180
    # Absolute directories that templates, ImageSource paths, output paths and local
    # <img src> paths inside HtmlContent must stay under (realpath-resolved).
    # Empty allowed_roots keeps BC locally (local <img> paths in HtmlContent are dropped);
    # production requires an explicit allowlist.
    allowed_roots: []
    # When true, an empty allowed_roots is a configuration error (fail-closed).
    path_allowlist_required: false
    # Maximum decoded size (bytes) of one data: image inside HtmlContent.
    html_image_max_bytes: 5242880

when@prod:
    nowo_word_template:
        timeout: 120
        path_allowlist_required: true
        allowed_roots:
            - '%kernel.project_dir%/templates'
            - '%kernel.project_dir%/var'
            - '%kernel.project_dir%/public'
