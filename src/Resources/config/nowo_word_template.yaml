# Example: copy to config/packages/nowo_word_template.yaml in your Symfony application.
# Delimiter settings for .docx template placeholders and conditional blocks.
# Values must match what template authors type in Microsoft Word (see docs/USAGE.md).

nowo_word_template:
    # Wall-clock timeout (seconds) for WordTemplateProcessor::process().
    # Applied as a cooperative deadline between merge phases plus set_time_limit.
    # Prefer '%env(int:PROCESS_TIMEOUT)%' (shared Nowo default 180). Keep below PHP
    # max_execution_time and the reverse-proxy write timeout (FrankenPHP / REQ-RUNTIME-001).
    timeout: 180

    # Absolute directories that templates, ImageSource paths, output paths and local
    # <img src> paths inside HtmlContent must stay under (realpath-resolved).
    # Empty = unrestricted for templates/images/output (BC) but local <img> paths in
    # HtmlContent are dropped. Set this in production.
    allowed_roots: []
    # - '%kernel.project_dir%/templates'
    # - '%kernel.project_dir%/var'

    # When true, an empty allowed_roots is a configuration error (fail-closed).
    # Recommended under when@prod.
    path_allowlist_required: false

    # Maximum decoded size (bytes) of one data: image inside HtmlContent. Remote URLs,
    # stream wrappers and local paths outside allowed_roots are always dropped.
    html_image_max_bytes: 5242880

    # Opening delimiter for scalar, nested, HTML, image, and table-row placeholders.
    # Used by PHPWord TemplateProcessor (setValue, setImageValue, cloneRow, etc.).
    macro_opening: '${'

    # Closing delimiter for placeholders (pairs with macro_opening).
    macro_closing: '}'

    # Prefix for conditional block opening markers; the block name follows after a space.
    # Full marker example: ${#if optional_funding}
    # Resolved in PHP via ConditionalBlock — nested blocks are supported (inside-out).
    conditional_if_opening: '${#if'

    # Suffix that closes the conditional opening marker (after the block name).
    conditional_if_closing: '}'

    # Prefix for conditional block closing markers; the block name follows after a space.
    # Full marker example: ${#endif optional_funding}
    conditional_endif_opening: '${#endif'

    # Suffix that closes the conditional end marker (after the block name).
    conditional_endif_closing: '}'

    # Expression conditionals (opt-in, since 1.8): ${#if total > 1000} … ${#endif}
    # A nameless ${#endif} closes the nearest open ${#if …} and makes it an expression block,
    # evaluated against the context with a function-less Symfony ExpressionLanguage.
    # Named blocks (${#if name} … ${#endif name} + ConditionalBlock) are unchanged.
    conditional_expressions:
        # false = expression markers stay as literal text (1.7 behaviour).
        enabled: false
        # exception: throw ConditionalExpressionException (invalid syntax, unknown variable, bad layout)
        # hide: remove the block whose expression fails (bad marker layouts are left as text);
        # keep: leave markers as text. hide / keep log a warning.
        on_error: exception
        # Maximum length of one expression (characters).
        max_length: 500
        # Time zone of now() / date(); null = PHP default. "Now" comes from the Symfony clock.
        timezone: null
        # Restrict functions (built-ins + host providers tagged nowo_word_template.expression_function_provider).
        functions:
            allow: ~        # null = all; e.g. [upper, lower, length]
            deny: []        # e.g. [now, date]
