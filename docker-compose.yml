name: word-template-bundle

services:
  php:
    build: .
    command: ["sleep", "infinity"]
    volumes:
      - .:/app
      # Coverage reports (composer test-coverage / coverage-check) are written to /app/coverage (REQ-DOC-001).
      - coverage-data:/app/coverage
    working_dir: /app

volumes:
  coverage-data: {}
